            async calculateDEMBounds() {
                // Start with dam center
                const center = turf.center(this.damLine);
                const [centerLng, centerLat] = center.geometry.coordinates;
                
                // Use a reasonable buffer size to avoid memory issues
                const buffer = 10; // 10km buffer
                
                const bounds = [
                    centerLng - buffer / 111, // West
                    centerLat - buffer / 111, // South  
                    centerLng + buffer / 111, // East
                    centerLat + buffer / 111  // North
                ];
                
                return bounds;
            }
            
            async fetchDEMData(bounds) {
                const [west, south, east, north] = bounds;
                
                // Determine zoom level based on area
                const area = (east - west) * (north - south) * 111 * 111; // Rough km²
                const zoom = area < 100 ? 14 : 13;
                
                // Calculate tile bounds
                const n = Math.pow(2, zoom);
                const tileWest = Math.floor((west + 180) / 360 * n);
                const tileEast = Math.floor((east + 180) / 360 * n);
                const tileNorth = Math.floor((1 - Math.log(Math.tan(north * Math.PI / 180) + 
                    1 / Math.cos(north * Math.PI / 180)) / Math.PI) / 2 * n);
                const tileSouth = Math.floor((1 - Math.log(Math.tan(south * Math.PI / 180) + 
                    1 / Math.cos(south * Math.PI / 180)) / Math.PI) / 2 * n);
                
                // Ensure we have at least 1 tile in each direction
                const tilesX = Math.max(1, Math.min(tileEast - tileWest + 1, 20));
                const tilesY = Math.max(1, Math.min(tileSouth - tileNorth + 1, 20));
                const width = tilesX * 256;
                const height = tilesY * 256;
                
                console.log(`DEM fetch: zoom=${zoom}, tiles=${tilesX}x${tilesY}, dimensions=${width}x${height}`);
                console.log(`Tile bounds: west=${tileWest}, north=${tileNorth}, east=${tileEast}, south=${tileSouth}`);
                
                if (width * height > 10000000) {
                    throw new Error('Area too large. Please zoom in or reduce the reservoir size.');
                }
                
                // Create combined elevation array
                const elevationData = new Float32Array(width * height);
                
                // Fetch all tiles
                const totalTiles = tilesX * tilesY;
                let loadedTiles = 0;
                
                this.showStatus(`Loading ${totalTiles} terrain tiles...`);
                
                for (let ty = tileNorth; ty <= tileSouth; ty++) {
                    for (let tx = tileWest; tx <= tileEast; tx++) {
                        const url = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${zoom}/${tx}/${ty}.png`;
                        
                        try {
                            const response = await fetch(url);
                            const blob = await response.blob();
                            const img = await this.loadImage(blob);
                            
                            const canvas = document.createElement('canvas');
                            canvas.width = 256;
                            canvas.height = 256;
                            const ctx = canvas.getContext('2d', { 
                                alpha: false,
                                desynchronized: true
                            });
                            ctx.drawImage(img, 0, 0);
                            
                            const imageData = ctx.getImageData(0, 0, 256, 256);
                            
                            // Copy to elevation array
                            const offsetX = (tx - tileWest) * 256;
                            const offsetY = (ty - tileNorth) * 256;
                            
                            for (let y = 0; y < 256; y++) {
                                for (let x = 0; x < 256; x++) {
                                    const idx = (y * 256 + x) * 4;
                                    const r = imageData.data[idx];
                                    const g = imageData.data[idx + 1];
                                    const b = imageData.data[idx + 2];
                                    
                                    const elevation = (r * 256 + g + b / 256) - 32768;
                                    
                                    const destIdx = (offsetY + y) * width + (offsetX + x);
                                    elevationData[destIdx] = elevation;
                                }
                            }
                            
                        } catch (error) {
                            console.warn(`Failed to load tile ${zoom}/${tx}/${ty}:`, error);
                            // Fill with no-data value
                            const offsetX = (tx - tileWest) * 256;
                            const offsetY = (ty - tileNorth) * 256;
                            
                            for (let y = 0; y < 256; y++) {
                                for (let x = 0; x < 256; x++) {
                                    const destIdx = (offsetY + y) * width + (offsetX + x);
                                    elevationData[destIdx] = -9999;
                                }
                            }
                        }
                        
                        loadedTiles++;
                        this.updateProgress(loadedTiles / totalTiles * 0.5);
                    }
                }
                
                return {
                    data: elevationData,
                    width: width,
                    height: height,
                    tileBounds: [tileWest, tileNorth, tileEast, tileSouth],
                    zoom: zoom,
                    geoBounds: bounds
                };
            }
            
            async runFloodFill(demData) {
                // Get dam cells in DEM grid
                const damCells = this.getDamCells(demData);
                
                if (damCells.length === 0) {
                    throw new Error('Dam line outside DEM bounds');
                }
                
                // Use actual crest elevation adjusted for water level
                const effectiveCrest = this.crestElevation * this.waterLevel;
                
                // Run flood-fill in worker
                this.floodWorker.postMessage({
                    demData: demData,
                    damCells: damCells,
                    crestElevation: effectiveCrest
                });
            }
            
            getDamCells(demData) {
                if (!this.damLine) return [];
                
                const damCells = [];
                const samples = this.sampleLinePoints(this.damLine.geometry.coordinates, 30);
                
                const n = Math.pow(2, demData.zoom);
                const [tileWest, tileNorth, tileEast, tileSouth] = demData.tileBounds;
                
                console.log('Getting dam cells for', samples.length, 'sample points');
                
                for (const [lng, lat] of samples) {
                    // Convert lng/lat to tile coordinates
                    const tileX = (lng + 180) / 360 * n;
                    const tileY = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 
                        1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
                    
                    // Convert to pixel coordinates within our DEM grid
                    const pixelX = Math.floor((tileX - tileWest) * 256);
                    const pixelY = Math.floor((tileY - tileNorth) * 256);
                    
                    if (pixelX >= 0 && pixelX < demData.width && 
                        pixelY >= 0 && pixelY < demData.height) {
                        const cell = pixelY * demData.width + pixelX;
                        damCells.push(cell);
                        
                        // Debug first few cells
                        if (damCells.length <= 3) {
                            console.log(`Dam point: lng=${lng.toFixed(4)}, lat=${lat.toFixed(4)} -> tile=(${tileX.toFixed(2)}, ${tileY.toFixed(2)}) -> pixel=(${pixelX}, ${pixelY}) -> cell=${cell}`);
                        }
                    }
                }
                
                console.log('Found', damCells.length, 'dam cells in DEM grid');
                return damCells;
            }
            
            onFloodFillComplete(floodedCells) {
                this.showStatus('Creating flood polygon...');
                
                // Convert flooded cells to polygon
                const polygon = this.createFloodPolygon(floodedCells);
                
                if (polygon) {
                    this.floodPolygon = polygon;
                    this.visualizeFlood(polygon);
                    this.calculateStatistics(polygon, floodedCells);
                    
                    document.getElementById('export-png').disabled = false;
                    document.getElementById('export-geojson').disabled = false;
                    
                    this.showMessage('Inundation computed successfully', 'success');
                } else {
                    this.showMessage('No flooding detected at current water level', 'warning');
                }
                
                this.hideStatus();
            }
            
            createFloodPolygon(floodedCells) {
                if (floodedCells.length === 0) return null;
                
                const width = this.demData.width;
                const height = this.demData.height;
                
                console.log(`Creating flood polygon from ${floodedCells.length} cells, grid size: ${width}x${height}`);
                
                // Find the bounds of flooded cells for debugging
                let minX = width, maxX = 0, minY = height, maxY = 0;
                for (const cell of floodedCells) {
                    const x = cell % width;
                    const y = Math.floor(cell / width);
                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x);
                    minY = Math.min(minY, y);
                    maxY = Math.max(maxY, y);
                }
                console.log(`Flooded area bounds in pixels: x=[${minX}, ${maxX}], y=[${minY}, ${maxY}]`);
                
                // Create a flat array for d3-contours in row-major order
                const values = new Array(width * height);
                values.fill(0);
                
                // Mark flooded cells
                for (const cell of floodedCells) {
                    if (cell >= 0 && cell < width * height) {
                        values[cell] = 1;
                    }
                }
                
                // Use marching squares to create contours
                const contours = d3.contours()
                    .size([width, height])
                    .thresholds([0.5])(values);
                
                if (!contours || contours.length === 0) {
                    console.log('No contours generated');
                    return null;
                }
                
                const contour = contours[0];
                if (!contour || !contour.coordinates || contour.coordinates.length === 0) {
                    console.log('Contour has no coordinates');
                    return null;
                }
                
                // Get transformation parameters
                const n = Math.pow(2, this.demData.zoom);
                const [tileWest, tileNorth, tileEast, tileSouth] = this.demData.tileBounds;
                
                console.log('Contour type:', contour.type);
                console.log('Number of rings/polygons:', contour.coordinates.length);
                console.log('Tile bounds:', tileWest, tileNorth, 'to', tileEast, tileSouth);
                console.log('Zoom level:', this.demData.zoom, 'n:', n);
                
                // Test coordinate transformation with center of flooded area
                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                const testTileX = tileWest + (centerX / 256);
                const testTileY = tileNorth + (centerY / 256);
                const testLng = (testTileX / n) * 360 - 180;
                const testLat = Math.atan(Math.sinh(Math.PI * (1 - 2 * testTileY / n))) * 180 / Math.PI;
                console.log(`Test transform: pixel(${centerX.toFixed(0)}, ${centerY.toFixed(0)}) -> tile(${testTileX.toFixed(2)}, ${testTileY.toFixed(2)}) -> lng/lat(${testLng.toFixed(4)}, ${testLat.toFixed(4)})`);
                
                // Also log dam line center for comparison
                if (this.damLine) {
                    const damCenter = turf.center(this.damLine);
                    console.log(`Dam center: lng=${damCenter.geometry.coordinates[0].toFixed(4)}, lat=${damCenter.geometry.coordinates[1].toFixed(4)}`);
                }
                
                // Process the contour based on its type
                const allRings = [];
                
                // Handle both Polygon and MultiPolygon cases
                if (contour.type === 'MultiPolygon') {
                    // MultiPolygon: array of polygons, each polygon is array of rings
                    for (const polygon of contour.coordinates) {
                        for (const ring of polygon) {
                            if (ring && ring.length > 2) {
                                allRings.push(ring);
                            }
                        }
                    }
                } else {
                    // Polygon: array of rings
                    for (const ring of contour.coordinates) {
                        if (ring && ring.length > 2) {
                            allRings.push(ring);
                        }
                    }
                }
                
                if (allRings.length === 0) {
                    console.log('No valid rings found');
                    return null;
                }
                
                console.log(`Processing ${allRings.length} rings`);
                
                // Transform to geographic coordinates
                const geoRings = [];
                
                for (const ring of allRings) {
                    const geoRing = [];
                    const step = Math.max(1, Math.floor(ring.length / 1000)); // Limit points per ring
                    
                    for (let i = 0; i < ring.length; i += step) {
                        const point = ring[i];
                        if (!point || point.length < 2) continue;
                        
                        let x = point[0];
                        let y = point[1];
                        
                        // Validate pixel coordinates
                        if (isNaN(x) || isNaN(y) || x < 0 || x > width || y < 0 || y > height) {
                            continue;
                        }
                        
                        // Convert pixel to tile coordinates
                        const tileX = tileWest + (x / 256.0);
                        const tileY = tileNorth + (y / 256.0);
                        
                        // Convert tile to lng/lat
                        const lng = (tileX / n) * 360 - 180;
                        const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * tileY / n))) * 180 / Math.PI;
                        
                        if (!isNaN(lng) && !isNaN(lat) && isFinite(lng) && isFinite(lat)) {
                            geoRing.push([lng, lat]);
                        }
                    }
                    
                    // Close the ring if needed and it has enough points
                    if (geoRing.length > 2) {
                        const first = geoRing[0];
                        const last = geoRing[geoRing.length - 1];
                        if (first[0] !== last[0] || first[1] !== last[1]) {
                            geoRing.push([first[0], first[1]]);
                        }
                        
                        // Only add rings with at least 4 points (minimum for a valid polygon)
                        if (geoRing.length >= 4) {
                            geoRings.push(geoRing);
                        }
                    }
                }
                
                if (geoRings.length === 0) {
                    console.log('No valid geographic rings created');
                    return null;
                }
                
                // Take only the largest ring (assumed to be the outer boundary)
                // Sort rings by number of points (crude approximation of size)
                geoRings.sort((a, b) => b.length - a.length);
                
                console.log(`Created ${geoRings.length} geographic rings, using largest with ${geoRings[0].length} points`);
                console.log(`First point of polygon: lng=${geoRings[0][0][0].toFixed(4)}, lat=${geoRings[0][0][1].toFixed(4)}`);
                
                // Create GeoJSON polygon with just the outer ring
                const polygon = {
                    type: 'Feature',
                    properties: {},
                    geometry: {
                        type: 'Polygon',
                        coordinates: [geoRings[0]] // Just the largest ring as outer boundary
                    }
                };
                
                // Validate the polygon
                try {
                    const area = turf.area(polygon);
                    if (isNaN(area) || area <= 0) {
                        console.error('Invalid polygon area:', area);
                        return null;
                    }
                    console.log('Polygon area:', (area / 1000000).toFixed(2), 'km²');
                    
                    // Get polygon center for final check
                    const polyCenter = turf.center(polygon);
                    console.log(`Polygon center: lng=${polyCenter.geometry.coordinates[0].toFixed(4)}, lat=${polyCenter.geometry.coordinates[1].toFixed(4)}`);
                    
                    // Simplify if too complex
                    if (geoRings[0].length > 500) {
                        const simplified = turf.simplify(polygon, {
                            tolerance: 0.00005,
                            highQuality: true
                        });
                        console.log('Simplified from', geoRings[0].length, 'to', simplified.geometry.coordinates[0].length, 'points');
                        return simplified;
                    }
                } catch (e) {
                    console.error('Error validating polygon:', e);
                    return null;
                }
                
                return polygon;
            }
            
            visualizeFlood(polygon) {
                // Remove existing flood layers
                if (this.map.getLayer('flood-polygon')) {
                    this.map.removeLayer('flood-polygon');
                }
                if (this.map.getLayer('flood-outline')) {
                    this.map.removeLayer('flood-outline');
                }
                if (this.map.getSource('flood-polygon')) {
                    this.map.removeSource('flood-polygon');
                }
                
                // Add flood polygon
                this.map.addSource('flood-polygon', {
                    type: 'geojson',
                    data: polygon
                });
                
                if (this.showDepthGradient) {
                    // Add with depth gradient
                    this.map.addLayer({
                        id: 'flood-polygon',
                        type: 'fill',
                        source: 'flood-polygon',
                        paint: {
                            'fill-color': [
                                'interpolate',
                                ['linear'],
                                ['zoom'],
                                10, '#4A90E2',
                                15, '#2E5D8B'
                            ],
                            'fill-opacity': 0.6
                        }
                    });
                } else {
                    // Simple binary flood
                    this.map.addLayer({
                        id: 'flood-polygon',
                        type: 'fill',
                        source: 'flood-polygon',
                        paint: {
                            'fill-color': '#4A90E2',
                            'fill-opacity': 0.5
                        }
                    });
                }
                
                // Add outline
                this.map.addLayer({
                    id: 'flood-outline',
                    type: 'line',
                    source: 'flood-polygon',
                    paint: {
                        'line-color': '#2E5D8B',
                        'line-width': 2
                    }
                });
            }
            
            updateVisualization() {
                if (this.floodPolygon) {
                    this.visualizeFlood(this.floodPolygon);
                }
            }
            
            calculateStatistics(polygon, floodedCells) {
                if (!polygon) return;
                
                // Calculate area
                const areaM2 = turf.area(polygon);
                const areaKm2 = areaM2 / 1000000;
                
                // Calculate dam length
                const damLength = this.damLine ? turf.length(this.damLine, { units: 'meters' }) : 0;
                
                // Calculate depths and volume from actual DEM data
                let minElevation = Infinity;
                let totalVolume = 0;
                let depthSum = 0;
                let validCells = 0;
                
                if (this.demData && floodedCells) {
                    const cellAreaM2 = this.getCellArea();
                    
                    for (const cell of floodedCells) {
                        const elevation = this.demData.data[cell];
                        if (elevation > -9999) {
                            minElevation = Math.min(minElevation, elevation);
                            const depth = this.crestElevation - elevation;
                            totalVolume += depth * cellAreaM2;
                            depthSum += depth;
                            validCells++;
                        }
                    }
                }
                
                const maxDepth = minElevation < Infinity ? this.crestElevation - minElevation : 0;
                const avgDepth = validCells > 0 ? depthSum / validCells : 0;
                
                // Update UI
                document.getElementById('stat-area').textContent = `${areaKm2.toFixed(2)} km²`;
                document.getElementById('stat-volume').textContent = `${(totalVolume / 1000000).toFixed(2)} million m³`;
                document.getElementById('stat-depth').textContent = `${maxDepth.toFixed(1)} m`;
                document.getElementById('stat-dam-length').textContent = `${damLength.toFixed(0)} m`;
                document.getElementById('stat-avg-depth').textContent = `${avgDepth.toFixed(1)} m`;
                
                document.getElementById('stats').style.display = 'block';
            }
            
            getCellArea() {
                // Calculate approximate cell area in m²
                // This is a simplification - actual area varies by latitude
                const zoom = this.demData.zoom;
                const resolution = 40075016.686 / Math.pow(2, zoom) / 256; // meters per pixel at equator
                
                // Adjust for latitude (rough approximation using dam center)
                const center = turf.center(this.damLine);
                const lat = center.geometry.coordinates[1];
                const latAdjustment = Math.cos(lat * Math.PI / 180);
                
                return resolution * resolution * latAdjustment;
            }
            
            switchBasemap(type) {
                // Remove existing basemap layers
                ['topo', 'osm', 'satellite'].forEach(id => {
                    if (this.map.getLayer(id)) {
                        this.map.removeLayer(id);
                    }
                    if (this.map.getSource(id)) {
                        this.map.removeSource(id);
                    }
                });
                
                let tiles, attribution, sourceId, maxzoom;
                
                switch(type) {
                    case 'topo':
                        tiles = ['https://tile.opentopomap.org/{z}/{x}/{y}.png'];
                        attribution = '© OpenTopoMap (CC-BY-SA)';
                        sourceId = 'topo';
                        maxzoom = 15;
                        break;
                    case 'satellite':
                        tiles = ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'];
                        attribution = '© Esri';
                        sourceId = 'satellite';
                        maxzoom = 19;
                        break;
                    case 'osm':
                        tiles = ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'];
                        attribution = '© OpenStreetMap';
                        sourceId = 'osm';
                        maxzoom = 19;
                        break;
                }
                
                // Add new source and layer
                this.map.addSource(sourceId, {
                    type: 'raster',
                    tiles: tiles,
                    tileSize: 256,
                    maxzoom: maxzoom,
                    attribution: attribution
                });
                
                // Add at the bottom of the layer stack
                let beforeLayer = null;
                if (this.map.getLayer('dam-line')) {
                    beforeLayer = 'dam-line';
                } else if (this.map.getLayer('flood-polygon')) {
                    beforeLayer = 'flood-polygon';
                }
                
                this.map.addLayer({
                    id: sourceId,
                    type: 'raster',
                    source: sourceId
                }, beforeLayer);
            }
            
            exportPNG() {
                this.map.once('idle', () => {
                    const canvas = this.map.getCanvas();
                    canvas.toBlob(blob => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `inundation-${Date.now()}.png`;
                        a.click();
                        URL.revokeObjectURL(url);
                    });
                });
                
                this.map.triggerRepaint();
            }
            
            exportGeoJSON() {
                if (!this.floodPolygon) return;
                
                const geoJSON = {
                    type: 'FeatureCollection',
                    features: [this.floodPolygon]
                };
                
                // Add properties
                geoJSON.features[0].properties = {
                    crestElevation: this.crestElevation,
                    waterLevel: this.waterLevel,
                    area: document.getElementById('stat-area').textContent,
                    volume: document.getElementById('stat-volume').textContent,
                    maxDepth: document.getElementById('stat-depth').textContent,
                    avgDepth: document.getElementById('stat-avg-depth').textContent
                };
                
                // Download
                const blob = new Blob([JSON.stringify(geoJSON, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `inundation-${Date.now()}.geojson`;
                a.click();
                URL.revokeObjectURL(url);
            }
            
            showStatus(text) {
                const status = document.getElementById('status');
                document.getElementById('status-text').textContent = text;
                status.classList.add('active');
            }
            
            hideStatus() {
                setTimeout(() => {
                    document.getElementById('status').classList.remove('active');
                }, 500);
            }
            
            updateProgress(value) {
                document.getElementById('progress-fill').style.width = `${value * 100}%`;
            }
            
            showMessage(text, type = 'info') {
                const messages = document.getElementById('messages');
                messages.innerHTML = `<div class="message ${type}-message">${text}</div>`;
                
                setTimeout(() => {
                    messages.innerHTML = '';
                }, 5000);
            }
        }
        
        // Initialize app when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new InundatorApp();
        });
    </script>
