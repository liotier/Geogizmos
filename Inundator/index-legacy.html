<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inundator v29 - Interactive reservoir inundation visualization</title>
    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --success: #27ae60;
            --warning: #f39c12;
            --border: #dfe4ea;
            --bg-light: #f8f9fa;
            --text: #2c3e50;
            --text-light: #6c757d;
            --water: #4A90E2;
            --water-deep: #2E5D8B;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            background: white;
            overflow: hidden;
        }
        
        #app {
            display: flex;
            height: 100vh;
        }
        
        #sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        #header {
            padding: 20px;
            border-bottom: 2px solid var(--secondary);
        }
        
        #header h1 {
            font-size: 24px;
            color: var(--primary);
            margin: 0;
        }
        
        #header .subtitle {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }
        
        #controls {
            padding: 20px;
            flex: 1;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text);
        }
        
        input[type="text"], 
        input[type="number"], 
        select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }
        
        input[type="text"]:focus, 
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--secondary);
        }
        
        .help-text {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }
        
        button {
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            background: white;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        
        button:hover:not(:disabled) {
            background: var(--bg-light);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        button.primary {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }
        
        button.primary:hover:not(:disabled) {
            background: #2980b9;
        }
        
        button.active {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        button.danger {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .slider-container {
            margin: 15px 0;
        }
        
        .slider-label {
            font-size: 12px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        
        .slider-value {
            font-weight: 500;
            color: var(--secondary);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            padding: 8px;
            background: var(--bg-light);
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .checkbox-group label {
            font-size: 13px;
            margin: 0;
            cursor: pointer;
        }
        
        #map-container {
            flex: 1;
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        #status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            display: none;
            min-width: 300px;
            text-align: center;
        }
        
        #status.active {
            display: block;
        }
        
        #progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        #progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.3s;
        }
        
        .stats {
            background: var(--bg-light);
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            padding: 4px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        
        .stats-row:last-child {
            border-bottom: none;
        }
        
        .stats-label {
            color: var(--text-light);
        }
        
        .stats-value {
            font-weight: 500;
            color: var(--text);
        }
        
        .message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .error-message {
            background: #f8d7da;
            border-left: 3px solid var(--accent);
            color: #721c24;
        }
        
        .info-message {
            background: #d1ecf1;
            border-left: 3px solid #0c5460;
            color: #004085;
        }
        
        .warning-message {
            background: #fff3cd;
            border-left: 3px solid var(--warning);
            color: #856404;
        }
        
        .success-message {
            background: #d4edda;
            border-left: 3px solid var(--success);
            color: #155724;
        }
        
        .drawing-hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.95);
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }
        
        .drawing-hint.active {
            display: block;
        }
        
        .maplibregl-canvas.drawing {
            cursor: crosshair !important;
        }
        
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            margin-top: 4px;
        }
        
        .dropdown.active {
            display: block;
        }
        
        .dropdown-item {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid var(--bg-light);
        }
        
        .dropdown-item:hover {
            background: var(--bg-light);
        }
        
        .dropdown-item:last-child {
            border-bottom: none;
        }
        
        .location-input-container {
            position: relative;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div id="header">
                <h1>Inundator</h1>
                <div class="subtitle">Interactive reservoir inundation visualization</div>
            </div>
            
            <div id="controls">
                <div id="messages"></div>
                
                <!-- Location Search -->
                <div class="control-group">
                    <label>Location</label>
                    <div class="location-input-container">
                        <input type="text" id="location-search" placeholder="Search for a location..." value="Nkondjock">
                        <div id="location-results" class="dropdown"></div>
                    </div>
                    <div class="help-text">Search for valleys or dam sites</div>
                </div>
                
                <!-- Dam Drawing Controls -->
                <div class="control-group">
                    <label>Dam definition</label>
                    <button id="draw-dam-btn" class="primary">
                        <span id="draw-dam-text">Draw dam line</span>
                    </button>
                    <button id="clear-dam-btn" disabled>Clear dam</button>
                </div>
                
                <!-- Dam Parameters -->
                <div class="control-group">
                    <label>Dam parameters</label>
                    
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>Safety margin</span>
                            <span class="slider-value" id="safety-margin-value">5 m</span>
                        </div>
                        <input type="range" id="safety-margin" min="0" max="20" value="5" step="1">
                        <div class="help-text">Height below terrain peak</div>
                    </div>
                    
                    <div style="margin-top: 10px;">
                        <label style="font-size: 12px;">Crest elevation (m.a.s.l.)</label>
                        <input type="number" id="crest-elevation" placeholder="Auto-calculated" step="1">
                        <div class="help-text">Override automatic calculation</div>
                    </div>
                    
                    <div class="slider-container">
                        <div class="slider-label">
                            <span>Water level</span>
                            <span class="slider-value" id="water-level-value">100%</span>
                        </div>
                        <input type="range" id="water-level" min="0" max="100" value="100" step="5">
                    </div>
                </div>
                
                <!-- Visualization Options -->
                <div class="control-group">
                    <label>Visualization options</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="depth-gradient" checked>
                        <label for="depth-gradient">Show depth gradient</label>
                    </div>
                </div>
                
                <!-- Base Map Selection -->
                <div class="control-group">
                    <label>Base map</label>
                    <select id="basemap-selector">
                        <option value="topo" selected>OpenTopoMap</option>
                        <option value="osm">OpenStreetMap standard</option>
                        <option value="satellite">Satellite</option>
                    </select>
                </div>
                
                <!-- Action Buttons -->
                <div class="control-group">
                    <button id="compute-btn" class="primary" disabled>Compute inundation</button>
                    <button id="export-png" disabled>Export PNG</button>
                    <button id="export-geojson" disabled>Export GeoJSON</button>
                </div>
                
                <!-- Statistics -->
                <div id="stats" class="stats" style="display: none;">
                    <div class="stats-row">
                        <span class="stats-label">Surface area:</span>
                        <span class="stats-value" id="stat-area">-</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">Volume:</span>
                        <span class="stats-value" id="stat-volume">-</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">Max depth:</span>
                        <span class="stats-value" id="stat-depth">-</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">Dam length:</span>
                        <span class="stats-value" id="stat-dam-length">-</span>
                    </div>
                    <div class="stats-row">
                        <span class="stats-label">Avg depth:</span>
                        <span class="stats-value" id="stat-avg-depth">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="map-container">
            <div id="map"></div>
            <div id="drawing-hint" class="drawing-hint">Click on the map to draw dam endpoints</div>
            <div id="status">
                <div id="status-text">Ready</div>
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-contour@4"></script>
    
    <script>
        class InundatorApp {
            constructor() {
                this.map = null;
                this.isDrawingDam = false;
                this.damLine = null;
                this.damPoints = [];
                this.crestElevation = null;
                this.floodPolygon = null;
                this.demData = null;
                this.searchTimeout = null;
                this.floodWorker = null;
                this.currentMousePosition = null;
                this.tileCache = {};
                
                // Visualization state
                this.showDepthGradient = true;
                this.waterLevel = 1.0;
                this.safetyMargin = 5;
                
                this.init();
            }
            
            init() {
                this.initMap();
                this.bindEvents();
                this.initWorker();
            }
            
            initMap() {
                // Try to create map with WebGL, with fallback options for compatibility
                try {
                    this.map = new maplibregl.Map({
                        container: 'map',
                        preserveDrawingBuffer: true,
                        failIfMajorPerformanceCaveat: false, // Allow on slower systems
                        antialias: false, // Disable for better compatibility
                        style: {
                            version: 8,
                            sources: {
                                'topo': {
                                    type: 'raster',
                                    tiles: ['https://tile.opentopomap.org/{z}/{x}/{y}.png'],
                                    tileSize: 256,
                                    maxzoom: 15,
                                    attribution: '© OpenTopoMap (CC-BY-SA)'
                                }
                            },
                            layers: [{
                                id: 'topo',
                                type: 'raster',
                                source: 'topo'
                            }]
                        },
                        center: [10.564, 4.777], // Nkondjock, Cameroon
                        zoom: 12,
                        maxZoom: 18
                    });
                } catch (error) {
                    console.error('Failed to initialize map with default settings, trying fallback:', error);
                    // Try with more conservative settings for Firefox
                    this.map = new maplibregl.Map({
                        container: 'map',
                        preserveDrawingBuffer: false, // Don't preserve for screenshots
                        failIfMajorPerformanceCaveat: false,
                        antialias: false,
                        maxPitch: 0, // Disable 3D
                        style: {
                            version: 8,
                            sources: {
                                'topo': {
                                    type: 'raster',
                                    tiles: ['https://tile.opentopomap.org/{z}/{x}/{y}.png'],
                                    tileSize: 256,
                                    maxzoom: 15,
                                    attribution: '© OpenTopoMap (CC-BY-SA)'
                                }
                            },
                            layers: [{
                                id: 'topo',
                                type: 'raster',
                                source: 'topo'
                            }]
                        },
                        center: [10.564, 4.777],
                        zoom: 12,
                        maxZoom: 18
                    });
                }
                
                this.map.addControl(new maplibregl.NavigationControl());
                
                // Set up map click handler for dam drawing
                this.map.on('click', (e) => {
                    if (!this.isDrawingDam) return;
                    this.addDamPoint(e.lngLat);
                });
                
                // Set up mouse move handler for drawing preview
                this.map.on('mousemove', (e) => {
                    if (!this.isDrawingDam || this.damPoints.length !== 1) return;
                    this.currentMousePosition = [e.lngLat.lng, e.lngLat.lat];
                    this.updateDrawingPreview();
                });
            }
            
            updateDrawingPreview() {
                if (!this.currentMousePosition || this.damPoints.length !== 1) return;
                
                const previewLine = {
                    type: 'Feature',
                    geometry: {
                        type: 'LineString',
                        coordinates: [this.damPoints[0], this.currentMousePosition]
                    }
                };
                
                if (this.map.getSource('dam-preview')) {
                    this.map.getSource('dam-preview').setData(previewLine);
                } else {
                    this.map.addSource('dam-preview', {
                        type: 'geojson',
                        data: previewLine
                    });
                    
                    this.map.addLayer({
                        id: 'dam-preview',
                        type: 'line',
                        source: 'dam-preview',
                        paint: {
                            'line-color': '#e74c3c',
                            'line-width': 2,
                            'line-dasharray': [2, 2],
                            'line-opacity': 0.7
                        }
                    });
                }
            }
            
            initWorker() {
                // Destroy any existing worker first
                if (this.floodWorker) {
                    this.floodWorker.terminate();
                    this.floodWorker = null;
                }
                
                // Force unique worker code with timestamp in the actual code
                const uniqueId = Date.now() + '_' + Math.random();
                const workerCode = `
                    // Worker v29 - Improved flood algorithm
                    let debugMessageCount = 0;
                    const MAX_DEBUG_MESSAGES = 200;
    
                    function debugLog(msg) {
                        if (debugMessageCount < MAX_DEBUG_MESSAGES) {
                            debugMessageCount++;
                            self.postMessage({ debug: msg });
                        }
                    }
                    
                    // Force cache bust: ${uniqueId}
                    self.postMessage({ debug: 'Worker v29 initialized at ${uniqueId}' });
                    
                    self.addEventListener('message', function(e) {
                        try {
                            const demData = e.data.demData;
                            const damCells = e.data.damCells;
                            const crestElevation = e.data.crestElevation;
                            
                            self.postMessage({ progress: 0.1 });
                            
                            const flooded = performFloodFill(demData, damCells, crestElevation);
                            
                            self.postMessage({ flooded: Array.from(flooded) });
                        } catch (error) {
                            self.postMessage({ error: 'Worker error: ' + error.toString() + ' at ' + error.stack });
                        }
                    });
                    
                    function performFloodFill(demData, damCells, crestElevation) {
                        const width = demData.width;
                        const height = demData.height;
                        const data = demData.data;
    
                        debugLog('Starting flood fill: ' + width + 'x' + height + ' grid');
                        debugLog('Dam cells count: ' + damCells.length);
                        debugLog('Crest elevation: ' + crestElevation);
                        
                        // First, create the barrier wall (dam extended to edges)
                        const visited = new Uint8Array(width * height);
                        
                        // Mark actual dam cells
                        for (let i = 0; i < damCells.length; i++) {
                            visited[damCells[i]] = 2; // 2 = barrier
                        }
                        
                        // Extend dam line to edges as a barrier wall
                        if (damCells.length >= 2) {
                            const firstDam = damCells[0];
                            const lastDam = damCells[damCells.length - 1];
                            const x1 = firstDam % width;
                            const y1 = Math.floor(firstDam / width);
                            const x2 = lastDam % width;
                            const y2 = Math.floor(lastDam / width);
                            
                            // Calculate line direction
                            const dx = x2 - x1;
                            const dy = y2 - y1;
                            const len = Math.sqrt(dx * dx + dy * dy);
                            
                            if (len > 0) {
                                const dirX = dx / len;
                                const dirY = dy / len;
                                
                                // Extend in both directions to edges
                                let extX = x1;
                                let extY = y1;
                                let extCount = 0;
                                const maxExtensions = Math.max(width, height) * 2;
                                
                                // Extend backwards
                                while (extX >= 0 && extX < width && extY >= 0 && extY < height && extCount < maxExtensions) {
                                    const cell = Math.floor(extY) * width + Math.floor(extX);
                                    if (cell >= 0 && cell < width * height) {
                                        visited[cell] = 2;
                                    }
                                    extX -= dirX;
                                    extY -= dirY;
                                    extCount++;
                                }
                                
                                // Extend forwards
                                extX = x2;
                                extY = y2;
                                extCount = 0;
                                
                                while (extX >= 0 && extX < width && extY >= 0 && extY < height && extCount < maxExtensions) {
                                    const cell = Math.floor(extY) * width + Math.floor(extX);
                                    if (cell >= 0 && cell < width * height) {
                                        visited[cell] = 2;
                                    }
                                    extX += dirX;
                                    extY += dirY;
                                    extCount++;
                                }
                                
                                // Fill gaps between dam points for continuous barrier
                                for (let i = 0; i < damCells.length - 1; i++) {
                                    const cell1 = damCells[i];
                                    const cell2 = damCells[i + 1];
                                    const px1 = cell1 % width;
                                    const py1 = Math.floor(cell1 / width);
                                    const px2 = cell2 % width;
                                    const py2 = Math.floor(cell2 / width);
                                    
                                    const steps = Math.max(Math.abs(px2 - px1), Math.abs(py2 - py1));
                                    if (steps > 0) {
                                        for (let s = 0; s <= steps; s++) {
                                            const t = s / steps;
                                            const x = Math.round(px1 + (px2 - px1) * t);
                                            const y = Math.round(py1 + (py2 - py1) * t);
                                            const cell = y * width + x;
                                            if (cell >= 0 && cell < width * height) {
                                                visited[cell] = 2;
                                                // Don't thicken barrier in narrow valleys
                                                // Only thicken if we're sure it won't block the valley
                                            }
                                        }
                                    }
                                }
                            }
                        }
                        
                        debugLog('Extended dam as barrier wall to edges');
                        
                        // Find elevation statistics at dam location
                        let minDamElevation = 99999;
                        let maxDamElevation = -99999;
                        let avgDamX = 0, avgDamY = 0;
                        
                        for (let i = 0; i < damCells.length; i++) {
                            const cell = damCells[i];
                            const elevation = data[cell];
                            const x = cell % width;
                            const y = Math.floor(cell / width);
                            avgDamX += x;
                            avgDamY += y;
                            
                            if (elevation > -9999) {
                                if (elevation < minDamElevation) minDamElevation = elevation;
                                if (elevation > maxDamElevation) maxDamElevation = elevation;
                            }
                        }
                        
                        avgDamX = avgDamX / damCells.length;
                        avgDamY = avgDamY / damCells.length;
                        
                        debugLog('Natural terrain at dam - min: ' + minDamElevation.toFixed(1) + 
                                ' max: ' + maxDamElevation.toFixed(1));
                        debugLog('Dam crest elevation: ' + crestElevation.toFixed(1));
                        
                        // NEW APPROACH: Find ALL valid seed cells adjacent to dam
                        // (below crest elevation, regardless of side)
                        const flooded = new Set();
                        const queue = [];
                        let seedCount = 0;
                        
                        // First attempt: direct neighbors of dam cells
                        for (let i = 0; i < damCells.length; i++) {
                            const damCell = damCells[i];
                            const neighbors = getNeighbors(damCell, width, height);
                            
                            for (let j = 0; j < neighbors.length; j++) {
                                const neighbor = neighbors[j];
                                
                                // Skip if already visited or is a barrier
                                if (visited[neighbor] !== 0) continue;
                                
                                const elevation = data[neighbor];
                                
                                // Add as seed if below crest elevation
                                if (elevation > -9999 && elevation < crestElevation) {
                                    queue.push(neighbor);
                                    visited[neighbor] = 1;
                                    flooded.add(neighbor);
                                    seedCount++;
                                }
                            }
                        }
                        
                        // If no seeds found, try looking 2 cells away from dam
                        if (seedCount === 0) {
                            debugLog('No seeds found adjacent to dam, searching 2 cells away...');
                            
                            for (let i = 0; i < damCells.length; i++) {
                                const damCell = damCells[i];
                                const damX = damCell % width;
                                const damY = Math.floor(damCell / width);
                                
                                // Check cells 2 steps away in all directions
                                for (let dx = -2; dx <= 2; dx++) {
                                    for (let dy = -2; dy <= 2; dy++) {
                                        if (Math.abs(dx) !== 2 && Math.abs(dy) !== 2) continue; // Skip inner cells
                                        
                                        const x = damX + dx;
                                        const y = damY + dy;
                                        
                                        if (x >= 0 && x < width && y >= 0 && y < height) {
                                            const cell = y * width + x;
                                            
                                            if (visited[cell] === 0) {
                                                const elevation = data[cell];
                                                
                                                if (elevation > -9999 && elevation < crestElevation) {
                                                    queue.push(cell);
                                                    visited[cell] = 1;
                                                    flooded.add(cell);
                                                    seedCount++;
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                        
                        debugLog('Found ' + seedCount + ' seed cells near dam');
                        
                        if (seedCount === 0) {
                            debugLog('WARNING: No valid flood seeds found! Check dam placement.');
                            return flooded;
                        }
                        
                        // Perform flood-fill with proper hydraulic constraints
                        let iterations = 0;
                        const MAX_ITERATIONS = 100000; // Increased limit for larger areas
                        
                        while (queue.length > 0 && iterations < MAX_ITERATIONS) {
                            iterations++;
                            
                            // Log progress periodically
                            if (iterations % 5000 === 0) {
                                debugLog('Iteration ' + iterations + ', queue: ' + queue.length + ', flooded: ' + flooded.size);
                            }
                            
                            const cell = queue.shift();
                            const cellElevation = data[cell];
                            const cellX = cell % width;
                            const cellY = Math.floor(cell / width);
                            
                            // Check if at map edge (treat edges as infinite walls)
                            const atEdge = (cellX === 0 || cellX === width - 1 || 
                                           cellY === 0 || cellY === height - 1);
                            
                            // Get neighbors
                            const neighbors = getNeighbors(cell, width, height);
                            
                            for (let k = 0; k < neighbors.length; k++) {
                                const neighbor = neighbors[k];
                                
                                // Skip if already visited or is a barrier
                                if (visited[neighbor] !== 0) continue;
                                
                                const neighborElev = data[neighbor];
                                
                                // PHYSICS: Water finds its level - any cell below crest elevation
                                // that is connected (not separated by barriers) will be flooded
                                // No cell-to-cell elevation check - that was causing uphill flow!
                                if (neighborElev > -9999 && neighborElev < crestElevation) {
                                    visited[neighbor] = 1;
                                    flooded.add(neighbor);
                                    queue.push(neighbor);
                                }
                            }
                        }
                        
                        if (iterations >= MAX_ITERATIONS) {
                            debugLog('WARNING: Stopped at iteration limit. Flooded ' + flooded.size + ' cells');
                        }
                        
                        debugLog('Flooding complete: ' + flooded.size + ' cells flooded');
                        
                        // Now identify separate water bodies
                        const bodies = identifyWaterBodies(flooded, visited, width, height, data, crestElevation);
                        
                        debugLog('Found ' + bodies.length + ' water bodies');
                        
                        // Select the upstream reservoir
                        if (bodies.length === 0) {
                            return new Set();
                        } else if (bodies.length === 1) {
                            debugLog('Only one water body found, using it');
                            return bodies[0].cells;
                        } else {
                            // Multiple bodies - select the upstream one
                            const selected = selectUpstreamBody(bodies, avgDamX, avgDamY, width, height);
                            debugLog('Selected body ' + selected.id + ' as upstream reservoir');
                            return selected.cells;
                        }
                    }
                    
                    function identifyWaterBodies(flooded, visited, width, height, data, crestElevation) {
                        const bodies = [];
                        const assigned = new Set();
                        let bodyId = 0;
                        
                        // Use flood-fill to identify connected components
                        for (let floodedCell of flooded) {
                            if (assigned.has(floodedCell)) continue;
                            
                            // Start a new body
                            bodyId++;
                            const bodyCells = new Set();
                            const queue = [floodedCell];
                            bodyCells.add(floodedCell);
                            assigned.add(floodedCell);
                            
                            let totalDepth = 0;
                            let minElevation = 99999;
                            let maxElevation = -99999;
                            let touchesEdge = false;
                            let minX = width, maxX = 0, minY = height, maxY = 0;
                            
                            while (queue.length > 0) {
                                const cell = queue.shift();
                                const x = cell % width;
                                const y = Math.floor(cell / width);
                                
                                // Track bounds
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                
                                // Check if touches edge
                                if (x === 0 || x === width - 1 || y === 0 || y === height - 1) {
                                    touchesEdge = true;
                                }
                                
                                // Calculate depth and track elevations
                                const elevation = data[cell];
                                if (elevation > -9999) {
                                    totalDepth += (crestElevation - elevation);
                                    if (elevation < minElevation) minElevation = elevation;
                                    if (elevation > maxElevation) maxElevation = elevation;
                                }
                                
                                // Find connected flooded neighbors
                                const neighbors = getNeighbors(cell, width, height);
                                for (let neighbor of neighbors) {
                                    if (flooded.has(neighbor) && !assigned.has(neighbor)) {
                                        bodyCells.add(neighbor);
                                        assigned.add(neighbor);
                                        queue.push(neighbor);
                                    }
                                }
                            }
                            
                            const centerX = (minX + maxX) / 2;
                            const centerY = (minY + maxY) / 2;
                            const avgDepth = totalDepth / bodyCells.size;
                            
                            bodies.push({
                                id: bodyId,
                                cells: bodyCells,
                                size: bodyCells.size,
                                avgDepth: avgDepth,
                                minElevation: minElevation,
                                maxElevation: maxElevation,
                                touchesEdge: touchesEdge,
                                centerX: centerX,
                                centerY: centerY,
                                bounds: [minX, minY, maxX, maxY]
                            });
                            
                            debugLog('Body ' + bodyId + ': size=' + bodyCells.size + 
                                    ', avgDepth=' + avgDepth.toFixed(1) + 'm' +
                                    ', minElev=' + minElevation.toFixed(1) + 'm' +
                                    ', maxElev=' + maxElevation.toFixed(1) + 'm' +
                                    ', touchesEdge=' + touchesEdge +
                                    ', center=(' + centerX.toFixed(0) + ',' + centerY.toFixed(0) + ')');
                        }
                        
                        return bodies;
                    }
                    
                    function selectUpstreamBody(bodies, damX, damY, width, height) {
                        // Score each body based on upstream characteristics
                        // Upstream reservoirs typically have:
                        // 1. Higher minimum elevation (they're higher up the valley)
                        // 2. Don't touch map edges (contained in valley)
                        // 3. Reasonable size and proximity to dam
                        
                        let bestBody = bodies[0];
                        let bestScore = -Infinity;
                        
                        for (let body of bodies) {
                            let score = 0;
                            
                            // CRITICAL: Prefer higher minimum elevation (upstream characteristic)
                            // This is the most reliable indicator
                            score += body.minElevation * 2;
                            
                            // Strongly penalize if touches edge (likely downstream flooding)
                            if (body.touchesEdge) {
                                score -= 10000;
                            }
                            
                            // Prefer closer to dam center
                            const distFromDam = Math.sqrt(
                                Math.pow(body.centerX - damX, 2) + 
                                Math.pow(body.centerY - damY, 2)
                            );
                            score -= distFromDam * 0.5;
                            
                            // Penalize extremely small bodies (might be artifacts)
                            if (body.size < 100) {
                                score -= 1000;
                            }
                            
                            // Penalize extremely large bodies (might be downstream flooding)
                            if (body.size > 100000) {
                                score -= 2000;
                            }
                            
                            debugLog('Body ' + body.id + ' score: ' + score.toFixed(1) + 
                                    ' (minElev: ' + body.minElevation.toFixed(1) + 
                                    ', touchesEdge: ' + body.touchesEdge + 
                                    ', dist: ' + distFromDam.toFixed(0) + ')');
                            
                            if (score > bestScore) {
                                bestScore = score;
                                bestBody = body;
                            }
                        }
                        
                        return bestBody;
                    }
                    
                    function getNeighbors(cell, width, height) {
                        const neighbors = [];
                        const x = cell % width;
                        const y = Math.floor(cell / width);
                        
                        if (x > 0) neighbors.push(cell - 1);
                        if (x < width - 1) neighbors.push(cell + 1);
                        if (y > 0) neighbors.push(cell - width);
                        if (y < height - 1) neighbors.push(cell + width);
                        
                        return neighbors;
                    }
                `;

            async calculateCrestElevation() {
                if (!this.damLine) return;
                
                this.showStatus('Calculating crest elevation...');
                
                try {
                    // Sample elevation along dam line
                    const samples = this.sampleLinePoints(this.damLine.geometry.coordinates, 10);
                    const elevations = await this.fetchElevations(samples);
                    
                    const maxElevation = Math.max(...elevations);
                    this.crestElevation = maxElevation - this.safetyMargin;
                    
                    document.getElementById('crest-elevation').value = Math.round(this.crestElevation);
                    
                    this.hideStatus();
                } catch (error) {
                    console.error('Error calculating crest elevation:', error);
                    this.showMessage('Failed to calculate crest elevation', 'error');
                    this.hideStatus();
                }
            }
            
            updateCrestElevation() {
                if (this.damLine && !document.getElementById('crest-elevation').value) {
                    this.calculateCrestElevation();
                }
            }
            
            sampleLinePoints(coordinates, distanceM) {
                const line = turf.lineString(coordinates);
                const length = turf.length(line, { units: 'meters' });
                const samples = [];
                
                for (let dist = 0; dist <= length; dist += distanceM) {
                    const point = turf.along(line, dist, { units: 'meters' });
                    samples.push(point.geometry.coordinates);
                }
                
                return samples;
            }
            
            async fetchElevations(points) {
                const elevations = [];
                
                for (const point of points) {
                    const [lng, lat] = point;
                    const elevation = await this.getElevationAtPoint(lng, lat);
                    elevations.push(elevation);
                }
                
                return elevations;
            }
            
            async getElevationAtPoint(lng, lat) {
                // Convert to tile coordinates at zoom 15
                const zoom = 15;
                const tileX = Math.floor((lng + 180) / 360 * Math.pow(2, zoom));
                const tileY = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 
                    1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));
                
                // Fetch tile if not cached
                const tileKey = `${zoom}/${tileX}/${tileY}`;
                
                if (!this.tileCache[tileKey]) {
                    const url = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${tileKey}.png`;
                    
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const img = await this.loadImage(blob);
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 256;
                    canvas.height = 256;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    this.tileCache[tileKey] = ctx.getImageData(0, 0, 256, 256);
                }
                
                // Get pixel position within tile
                const n = Math.pow(2, zoom);
                const pixelX = ((lng + 180) / 360 * n - tileX) * 256;
                const pixelY = ((1 - Math.log(Math.tan(lat * Math.PI / 180) + 
                    1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n - tileY) * 256;
                
                const px = Math.floor(pixelX);
                const py = Math.floor(pixelY);
                
                const imageData = this.tileCache[tileKey];
                const idx = (py * 256 + px) * 4;
                
                const r = imageData.data[idx];
                const g = imageData.data[idx + 1];
                const b = imageData.data[idx + 2];
                
                // Decode Terrarium format
                const elevation = (r * 256 + g + b / 256) - 32768;
                
                return elevation;
            }
            
            loadImage(blob) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = URL.createObjectURL(blob);
                });
            }
            
            async computeInundation() {
                if (!this.damLine) return;

                if (manualElevation) {

                    return;

                this.showStatus('Fetching elevation data...');
