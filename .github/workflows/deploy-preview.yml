name: Deploy Claude Branch Preview

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        id: extract_branch
        run: |
          # Get branch name and sanitize it for URL
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g')
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "safe_branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Deploy to preview directory
        run: |
          PREVIEW_DIR="gh-pages/preview/${{ steps.extract_branch.outputs.safe_branch }}"

          # Create preview directory
          mkdir -p "$PREVIEW_DIR"

          # Copy all files except .git and gh-pages directory
          rsync -av --exclude='.git' --exclude='gh-pages' --exclude='.github' . "$PREVIEW_DIR/"

          # Generate index page for preview directory listing
          cd gh-pages/preview
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Geogizmos Preview Deployments</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
                  h1 { color: #2c3e50; }
                  ul { list-style: none; padding: 0; }
                  li { padding: 10px; border-bottom: 1px solid #ddd; }
                  a { color: #3498db; text-decoration: none; font-size: 18px; }
                  a:hover { text-decoration: underline; }
                  .date { color: #7f8c8d; font-size: 14px; margin-left: 10px; }
              </style>
          </head>
          <body>
              <h1>🚀 Geogizmos Preview Deployments</h1>
              <p>Active preview deployments for Claude branches:</p>
              <ul id="previews"></ul>
              <script>
                  const dirs = [];
          EOF

          # Add all preview directories to the list
          for dir in */; do
              if [ "$dir" != "./" ]; then
                  dirname="${dir%/}"
                  echo "        dirs.push('$dirname');" >> index.html
              fi
          done

          cat >> index.html << 'EOF'
                  const list = document.getElementById('previews');
                  dirs.sort().reverse().forEach(dir => {
                      const li = document.createElement('li');
                      const a = document.createElement('a');
                      a.href = dir + '/Isosmfar/';
                      a.textContent = dir;
                      li.appendChild(a);
                      list.appendChild(li);
                  });
              </script>
          </body>
          </html>
          EOF

      - name: Commit and push to gh-pages
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy preview for ${{ steps.extract_branch.outputs.branch }}" || echo "No changes to commit"
          git push

      - name: Comment on PR with preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const branchName = '${{ steps.extract_branch.outputs.branch }}';
            const safeBranch = '${{ steps.extract_branch.outputs.safe_branch }}';
            const previewUrl = `https://${{ github.repository_owner }}.github.io/Geogizmos/preview/${safeBranch}/Isosmfar/`;

            // Find PR for this branch
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open'
            });

            if (pulls.length > 0) {
              const pr = pulls[0];

              // Check if comment already exists
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Preview deployment')
              );

              const commentBody = `## 🚀 Preview Deployment Ready!

**Preview URL:** ${previewUrl}

**Branch:** \`${branchName}\`

This preview will update automatically with each push to this branch.`;

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody
                });
              }
            }
