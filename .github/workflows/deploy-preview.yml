name: Deploy Claude Branch Preview

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        id: extract_branch
        run: |
          # Get branch name and sanitize it for URL
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g')
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "safe_branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Prepare deployment directory
        run: |
          # Create deployment structure
          mkdir -p deploy/preview/${{ steps.extract_branch.outputs.safe_branch }}

          # Copy all project files to the preview directory
          rsync -av --exclude='.git' --exclude='.github' --exclude='deploy' --exclude='node_modules' . deploy/preview/${{ steps.extract_branch.outputs.safe_branch }}/

          # List existing preview directories from the live gh-pages branch (if
          # any) so the index reflects every active preview, not just this one
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          EXISTING_PREVIEWS=""
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            EXISTING_PREVIEWS=$(git ls-tree -d --name-only origin/gh-pages:preview 2>/dev/null || true)
          fi
          ALL_PREVIEWS=$(printf '%s\n%s\n' "$EXISTING_PREVIEWS" "${{ steps.extract_branch.outputs.safe_branch }}" | sed '/^$/d' | sort -u)

          # Create preview index page (do NOT create root index to avoid overwriting production)
          {
            echo '<!DOCTYPE html>'
            echo '<html>'
            echo '<head>'
            echo '    <title>Geogizmos Preview Deployments</title>'
            echo '    <style>'
            echo "        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }"
            echo '        h1 { color: #2c3e50; }'
            echo '        ul { list-style: none; padding: 0; }'
            echo '        li { padding: 10px; border-bottom: 1px solid #ddd; }'
            echo '        li .branch { font-weight: 600; display: block; margin-bottom: 4px; }'
            echo '        a { color: #3498db; text-decoration: none; margin-right: 16px; }'
            echo '        a:hover { text-decoration: underline; }'
            echo '    </style>'
            echo '</head>'
            echo '<body>'
            echo '    <h1>🚀 Geogizmos Preview Deployments</h1>'
            echo '    <ul>'
            while IFS= read -r branch; do
              [ -z "$branch" ] && continue
              echo "        <li><span class=\"branch\">$branch</span><a href=\"$branch/Inundator/\">Inundator</a><a href=\"$branch/Isosmfar/\">Isosmfar</a></li>"
            done <<< "$ALL_PREVIEWS"
            echo '    </ul>'
            echo '</body>'
            echo '</html>'
          } > deploy/preview/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
          destination_dir: .

      - name: Comment on PR with preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const branchName = '${{ steps.extract_branch.outputs.branch }}';
            const safeBranch = '${{ steps.extract_branch.outputs.safe_branch }}';
            const previewBase = 'https://${{ github.repository_owner }}.github.io/Geogizmos/preview/' + safeBranch + '/';
            const inundatorUrl = previewBase + 'Inundator/';
            const isosmfarUrl = previewBase + 'Isosmfar/';

            // Find PR for this branch
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: context.repo.owner + ':' + branchName,
              state: 'open'
            });

            if (pulls.length > 0) {
              const pr = pulls[0];

              // Check if comment already exists
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Preview Deployment Ready')
              );

              const commentBody = '## 🚀 Preview Deployment Ready!\n\n' +
                '**Inundator:** ' + inundatorUrl + '\n\n' +
                '**Isosmfar:** ' + isosmfarUrl + '\n\n' +
                '**Branch:** `' + branchName + '`\n\n' +
                'This preview will update automatically with each push to this branch.';

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody
                });
              }
            }
