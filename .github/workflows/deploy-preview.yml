name: Deploy Claude Branch Preview

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract branch name
        id: extract_branch
        run: |
          # Get branch name and sanitize it for URL
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g')
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "safe_branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT

      - name: Prepare deployment directory
        run: |
          # Create deployment structure
          mkdir -p deploy/preview/${{ steps.extract_branch.outputs.safe_branch }}

          # Copy all project files to the preview directory
          rsync -av --exclude='.git' --exclude='.github' --exclude='deploy' . deploy/preview/${{ steps.extract_branch.outputs.safe_branch }}/

          # Create preview index page
          cat > deploy/preview/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Geogizmos Preview Deployments</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
                  h1 { color: #2c3e50; }
                  ul { list-style: none; padding: 0; }
                  li { padding: 10px; border-bottom: 1px solid #ddd; }
                  a { color: #3498db; text-decoration: none; font-size: 18px; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>🚀 Geogizmos Preview Deployments</h1>
              <p>Active preview deployment:</p>
              <ul>
                  <li><a href="${{ steps.extract_branch.outputs.safe_branch }}/Isosmfar/">${{ steps.extract_branch.outputs.safe_branch }}</a></li>
              </ul>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
          destination_dir: .

      - name: Comment on PR with preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const branchName = '${{ steps.extract_branch.outputs.branch }}';
            const safeBranch = '${{ steps.extract_branch.outputs.safe_branch }}';
            const previewUrl = 'https://${{ github.repository_owner }}.github.io/Geogizmos/preview/' + safeBranch + '/Isosmfar/';

            // Find PR for this branch
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: context.repo.owner + ':' + branchName,
              state: 'open'
            });

            if (pulls.length > 0) {
              const pr = pulls[0];

              // Check if comment already exists
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Preview Deployment Ready')
              );

              const commentBody = '## 🚀 Preview Deployment Ready!\n\n' +
                '**Preview URL:** ' + previewUrl + '\n\n' +
                '**Branch:** `' + branchName + '`\n\n' +
                'This preview will update automatically with each push to this branch.';

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: commentBody
                });
              }
            }
